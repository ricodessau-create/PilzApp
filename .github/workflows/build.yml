name: Sporadar APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Maps-Key prüfen und eintragen
        env:
          KEY_ROH: ${{ secrets.MAPS_API_KEY }}
        run: |
          KEY=$(printf '%s' "$KEY_ROH" | tr -d '[:space:]"')
          if [ -z "$KEY" ]; then
            echo "FEHLER: Secret MAPS_API_KEY fehlt oder ist leer"
            exit 1
          fi
          echo "Key gefunden, Laenge: ${#KEY} Zeichen (Google-Keys haben 39)"
          printf 'MAPS_API_KEY=%s\n' "$KEY" > local.properties

      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Sporadar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
